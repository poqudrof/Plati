name: Ubuntu
slug: ubuntu
description: Ubuntu 24.04 LTS dev environment.
image: images:ubuntu/24.04/cloud
profiles:
    - default
    - docker
resources:
    cpu: 2
    disk: 20GB
    memory: 4GB
terminal_user: ubuntu
includes:
    - tailscale
    - sshx
    - docker
    - openvscode-server
    - claude-code
first_init_commands:
    - apt-get update -y
    - apt-get install -y git curl wget build-essential openssh-server
    - printf 'PasswordAuthentication no\nPubkeyAuthentication yes\n' > /etc/ssh/sshd_config.d/plati.conf
    - systemctl enable ssh
    - systemctl restart ssh
    - usermod -aG docker ubuntu
rebuild_commands:
    - systemctl enable ssh
    - systemctl start ssh
persistence:
    mode: normal
    directories:
        - path: /home/ubuntu
          size: 20GB
