name: Python Development
slug: python-dev
description: Python 3.12 development environment with common tools
image: images:ubuntu/24.04/cloud
profiles:
  - default
resources:
  cpu: 2
  memory: 4GB
  disk: 20GB
cloud_init: |
  #cloud-config
  packages:
    - git
    - curl
    - build-essential
    - python3.12
    - python3.12-venv
    - python3-pip
  runcmd:
    - update-alternatives --install /usr/bin/python python /usr/bin/python3.12 1
    - pip install poetry

persistence:
  mode: normal
  directories:
    - path: /workspace
      size: 20GB
      pool: default

first_init_commands: []

rebuild_commands:
  - cd /workspace && git pull --ff-only 2>/dev/null || true
