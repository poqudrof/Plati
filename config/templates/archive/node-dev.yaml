name: Node.js Development
slug: node-dev
description: Node.js 22 LTS development environment with common tools
image: images:ubuntu/24.04/cloud
profiles:
  - default
resources:
  cpu: 2
  memory: 4GB
  disk: 20GB
cloud_init: |
  #cloud-config
  packages:
    - git
    - curl
    - build-essential
  runcmd:
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - npm install -g pnpm

persistence:
  mode: normal
  directories:
    - path: /workspace
      size: 20GB
      pool: default

first_init_commands: []

rebuild_commands:
  - cd /workspace && git pull --ff-only 2>/dev/null || true
