name: Site Équipe SCH
slug: site-sch
description: SCH peac2h public site (catie-aq)
image: images:ubuntu/24.04/cloud
profiles:
    - default
resources:
    cpu: 2
    disk: 20GB
    memory: 4GB
terminal_user: ubuntu
includes:
    - claude-code
    - docker
    - openvscode-server
    - sshx
    - tailscale
first_init_commands:
    - apt-get update -y
    - apt-get install -y git curl wget build-essential openssh-server
    - printf 'PasswordAuthentication no\nPubkeyAuthentication yes\n' > /etc/ssh/sshd_config.d/plati.conf
    - systemctl enable ssh
    - systemctl restart ssh
    # The docker mixin installs the daemon but knows nothing about terminal_user:
    # each template adds its own user to the docker group.
    - usermod -aG docker ubuntu
rebuild_commands:
    - cd /home/ubuntu/sch-site && git pull --ff-only || true
persistence:
    mode: normal
    directories:
        - path: /home/ubuntu
          size: 20GB
repos:
    - name: sch-site
      dest: /home/ubuntu/sch-site
