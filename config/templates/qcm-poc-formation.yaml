name: QCM avec IA
slug: qcm-poc-formation
description: AI State of the Art public site (catie-aq)
image: images:ubuntu/24.04/cloud
profiles:
    - default
resources:
    cpu: 2
    disk: 20GB
    memory: 4GB
terminal_user: ubuntu
includes:
    - claude-code
    - openvscode-server
    - tailscale
    - docker
first_init_commands:
    - cp -rn /etc/skel/. /home/ubuntu/ || true
    - chown -R ubuntu:ubuntu /home/ubuntu
    - apt-get update -y
    - apt-get install -y git curl wget build-essential openssh-server
    - printf 'PasswordAuthentication no\nPubkeyAuthentication yes\n' > /etc/ssh/sshd_config.d/plati.conf
    - systemctl enable ssh
    - systemctl restart ssh
    - usermod -aG docker ubuntu
rebuild_commands:
    - cd /home/ubuntu/poc-formation && git pull --ff-only || true
persistence:
    mode: normal
    directories:
        - path: /home/ubuntu
          size: 20GB
repos:
    - name: poc-formation
      dest: /home/ubuntu/poc-formation
